<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dieta</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--g:#2f6b4f;--gl:#e6f2ec;--bg:#f6f7f6;--ln:#e4e7e5;--tx:#1c211e;--mu:#7b847f;--r:18px}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font:15px Inter,system-ui,sans-serif;color:var(--tx);background:#fff;max-width:480px;margin:auto;min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
h1,h2,.ser{font-family:Newsreader,Georgia,serif;font-weight:600}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hd{display:flex;align-items:center;justify-content:center;position:relative;padding:calc(14px + env(safe-area-inset-top)) 16px 8px}
.hd h1{font-size:22px}.hd .r{position:absolute;right:16px}.hd .l{position:absolute;left:12px}
.prof{width:34px;height:34px;border:1.8px solid var(--tx);border-radius:50%;display:grid;place-items:center}
.wk{display:grid;grid-template-columns:repeat(7,1fr);padding:6px 8px 12px;border-bottom:1px solid var(--ln);text-align:center;color:var(--mu);font-size:13px}
.wk button{display:grid;justify-items:center;gap:4px}.wk .on b{font-weight:600}
.ring{width:42px;height:42px;position:relative;display:grid;place-items:center;color:var(--tx)}
.ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);stroke-width:3.5}
.wk .on .ring svg circle:last-child{stroke-width:5}.wk .on .ring{background:var(--gl);border-radius:50%}
.car{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;padding:16px;scrollbar-width:none}.car::-webkit-scrollbar{display:none}
.car>*{flex:0 0 100%;scroll-snap-align:center}
.card{border:1px solid var(--ln);border-radius:var(--r);padding:16px;background:#fff}
.sum{display:grid;gap:10px;text-align:center}.sum.c2{grid-template-columns:1fr 1fr;background:var(--bg);border:0}.sum.c3{grid-template-columns:repeat(3,1fr)}
.sum small{color:var(--mu)}.big{font:600 28px Newsreader,serif;line-height:1}.arc{width:100%;height:auto;stroke-width:9;margin-top:6px}
.t b{color:var(--tx);font-weight:600}.t .mini{margin-left:auto;display:flex;align-items:center;gap:4px;border:1px solid var(--ln);border-radius:16px;padding:4px 10px;color:var(--g);font-size:13px}.t .mini svg{width:16px;height:16px}.emp{color:var(--mu);font-size:13px;margin:0 0 4px 28px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 16px 8px;scrollbar-width:none}.chips button{flex:none;border:1px solid var(--ln);border-radius:20px;padding:7px 14px;font-size:14px;color:var(--mu)}.chips .on{background:var(--g);border-color:var(--g);color:#fff}.note{margin:4px 16px;padding:10px 12px;background:var(--gl);border-radius:12px;font-size:13px}
.dots{display:flex;justify-content:center;gap:7px;margin-bottom:6px}.dots i{width:8px;height:8px;border-radius:50%;background:#cfe0d6}.dots i.on{background:var(--g)}
.sec{padding:8px 16px}.sec h2{font:600 20px Inter,sans-serif;margin:10px 0}
.t{display:flex;align-items:center;gap:8px;color:var(--mu);font-size:14px;margin:14px 0 6px}.t svg{width:20px;height:20px}.t.ok{color:var(--g)}.t.ok svg{fill:var(--g);stroke:#fff;border-radius:50%}
.meal{display:grid;grid-template-columns:1fr 92px;gap:10px;align-items:center;margin-bottom:6px;position:relative}
.meal h3{font:600 18px/1.2 Newsreader,serif;margin-bottom:6px}.meal p{color:var(--mu);font-size:13px}
.meal img,.ph{width:92px;height:92px;border-radius:50%;object-fit:cover;background:var(--gl)}
.pill{display:inline-block;background:var(--bg);border-radius:20px;font-weight:600;font-size:13px;margin-top:6px}
.acts{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.acts button{border:1px solid var(--ln);border-radius:12px;padding:10px 4px;display:flex;gap:6px;justify-content:center;align-items:center;font-size:14px}
.acts .done{background:var(--gl);border-color:var(--g);color:var(--g)}.skip{opacity:.5}
.pen{position:absolute;top:-4px;right:-4px;width:30px;height:30px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center}.pen svg{width:16px;height:16px}
.wide{display:flex;align-items:center;justify-content:space-between;width:100%;background:var(--bg);border-radius:var(--r);padding:12px 12px 12px 20px;margin:12px 0}
.wide span.b{background:#e3e6e4;border-radius:20px;padding:10px 16px;display:flex;gap:6px}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom));width:min(448px,92vw);background:var(--g);color:#fff;padding:15px;border-radius:30px;font-weight:600;z-index:5}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:grid;grid-template-columns:1fr 1fr;background:#fff;border-top:1px solid var(--ln);padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:6}
.nav button{display:grid;justify-items:center;gap:2px;font-size:12px;color:var(--mu)}.nav .on{color:var(--g);font-weight:600}
.dayrow{display:flex;justify-content:space-between;align-items:center;border:1.5px solid #888;border-radius:12px;padding:12px 16px;margin:12px 16px}
.sheet{position:fixed;top:0;bottom:0;left:50%;width:100%;max-width:480px;transform:translateX(-50%);background:#fff;z-index:20;overflow:auto;display:none}.sheet.show{display:block}
.srch{display:flex;gap:10px;padding:8px 16px}.srch input{flex:1;border:1px solid var(--ln);border-radius:24px;padding:12px 16px;font:inherit}
.srch button{width:46px;height:46px;border:1px solid var(--ln);border-radius:50%;display:grid;place-items:center}
.opt{display:grid;grid-template-columns:1fr 70px;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--ln);position:relative}
.opt img{width:70px;height:70px;border-radius:14px;object-fit:cover}.opt .h{position:absolute;right:16px;top:4px;color:#d33}.opt .h svg{width:16px;height:16px}
.opt h3{font:600 16px/1.25 Newsreader,serif}.opt p{color:var(--mu);font-size:13px;margin-top:4px}
.rimg{width:230px;height:230px;border-radius:50%;object-fit:cover;display:block;margin:6px auto 16px}
.rt{text-align:center;padding:0 20px}.rt h1{font-size:26px;line-height:1.15}
.mac{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;margin:18px 16px;gap:6px}.mac b{display:block;font:600 17px Newsreader,serif}.mac small{color:var(--mu)}
.rs{padding:16px;border-top:8px solid var(--bg)}.rs h2{font:600 18px Inter,sans-serif;margin-bottom:10px}
.rs li{padding:11px 0;border-bottom:1px solid var(--ln);list-style:none}.rs ol li{border:0;list-style:decimal;margin-left:18px;line-height:1.5}
.step{display:flex;align-items:center;gap:14px;margin:10px 0}.step button{width:40px;height:40px;border:1px solid var(--ln);border-radius:50%;font-size:20px}
.trash{position:absolute;top:-6px;width:30px;height:30px;border-radius:50%;background:#fff;border:1px solid var(--ln);color:#b3261e;display:grid;place-items:center}.trash svg{width:16px;height:16px}
.ed{padding:8px 16px 40px;display:grid;gap:12px}.ed label{display:grid;gap:4px;font-size:13px;color:var(--mu)}.ed input,.ed textarea{border:1px solid var(--ln);border-radius:12px;padding:10px 12px;font:inherit;color:var(--tx);width:100%}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.btn{background:var(--g);color:#fff;border-radius:24px;padding:14px;font-weight:600;width:100%}.btn2{border:1px solid var(--g);color:var(--g);border-radius:24px;padding:12px;font-weight:600;width:100%}
.rs li{display:flex;justify-content:space-between;align-items:center;gap:8px}.rs li button{color:var(--g);flex:none}
.si{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--ln)}.si span{flex:1}.si.bought span{text-decoration:line-through;color:var(--mu)}.ck{width:26px;height:26px;border:1.8px solid var(--g);border-radius:50%;display:grid;place-items:center;color:#fff;flex:none}.bought .ck{background:var(--g)}.ck svg{width:16px;height:16px}.xx{color:var(--mu)}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--tx);color:#fff;padding:10px 18px;border-radius:20px;z-index:50}
</style>
</head>
<body>
<div id="app">
  <div style="text-align: center; padding: 40px 20px;">
    <h2>Witaj w aplikacji!</h2>
    <p style="color: #666; margin: 15px 0;">Baza danych jest pusta. Wgraj plik PDF z dietą, aby rozpocząć.</p>
    <button onclick="$('#pdf').click()" style="background: #2f6b4f; color: white; border: none; padding: 14px 24px; border-radius: 20px; font-weight: bold; font-size: 16px; cursor: pointer;">
      📥 Wgraj plik PDF z dietą
    </button>
  </div>
</div>
<div class="sheet" id="rec"></div><div class="sheet" id="shop"></div><div class="sheet" id="pick"></div>
<input type="file" id="pdf" accept="application/pdf" hidden><input type="date" id="dp" style="position:fixed;opacity:0;pointer-events:none;top:0">
<nav class="nav"><button id="n1" onclick="go('dz')"><svg viewBox="0 0 24 24"><path d="M5 4h12a2 2 0 0 1 2 2v14H7a2 2 0 0 1-2-2zM9 4v8l2-1.5 2 1.5V4"/></svg>Dziennik</button>
<button id="n2" onclick="go('pl')"><svg viewBox="0 0 24 24"><path d="M7 3h10v18H7zM10 8h4M10 12h4M10 16h4"/></svg>Plan</button></nav>
<script>
const $=s=>document.querySelector(s),I={
 chk:'<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',x:'<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
 sw:'<svg viewBox="0 0 24 24"><path d="M8 20V5M4 9l4-4 4 4M16 4v15M12 15l4 4 4-4"/></svg>',clk:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
 pen:'<svg viewBox="0 0 24 24"><path d="M4 20l4-1L19 8l-3-3L5 16zM14 7l3 3"/></svg>',plus:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>',
 back:'<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',cal:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M8 14l3 3 5-5"/></svg>',
 flt:'<svg viewBox="0 0 24 24"><path d="M4 8h10M18 8h2M4 16h2M10 16h10"/><circle cx="16" cy="8" r="2"/><circle cx="8" cy="16" r="2"/></svg>',heart:'<svg viewBox="0 0 24 24" style="fill:#d33;stroke:#d33"><path d="M12 20s-8-5-8-11a4.5 4.5 0 0 1 8-2.5A4.5 4.5 0 0 1 20 9c0 6-8 11-8 11z"/></svg>',
 car:'<svg viewBox="0 0 24 24" style="width:14px;height:14px"><path d="M6 9l6 6 6-6"/></svg>'};
const iso=d=>d.toLocaleDateString('sv'),S={view:'dz',date:iso(new Date()),edit:false,max:5000};
const MIES=['stycznia','lutego','marca','kwietnia','maja','czerwca','lipca','sierpnia','września','października','listopada','grudnia'],
 DN=['Poniedziałek','Wtorek','Środa','Czwartek','Piątek','Sobota','Niedziela'];
const SL=[['Śniadanie','6:00-9:00'],['Drugie śniadanie','9:00-11:00'],['Lunch','11:00-14:00'],['Obiad','14:00-17:00'],['Kolacja','18:00-21:00']];
function sections(ms,mode){S.ms=ms;const row=(n,t,items,add)=>`<div class="t">${I.clk}<b>${n}</b><span>${t}</span>${add?`<button class="mini" onclick="openPick(null,${add})">${I.plus}Dodaj</button>`:''}</div>${items.map(m=>mealCard(m,mode)).join('')||'<div class="emp">Brak posiłku</div>'}`;
 let o=SL.map((x,i)=>row(`Posiłek ${i+1} · ${x[0]}`,x[1],ms.filter(m=>m.slot==x[0]),i+1)).join('');const ex=ms.filter(m=>!SL.some(x=>x[0]==m.slot));return o+(ex.length?row('Dodatkowe','',ex,0):'')}
const D=s=>new Date(s+'T12:00'),
J=async(u,o)=>{
  const r=await fetch(u,o);
  if(!r.ok){
    const txt=await r.text().catch(()=>'');
    throw new Error(`Błąd HTTP ${r.status}: ${txt.slice(0,100)}`);
  }
  return r.json();
},
P=(u,m,b)=>J(u,{method:m,headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
const toast=t=>{const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2500)};
function go(v){S.view=v;S.edit=false;render()}
function arc(p,col,half){const r=40,c=Math.PI*r;return half?`<svg class="arc" viewBox="0 0 100 52"><path d="M10 50A40 40 0 0 1 90 50" stroke="#dfe8e3"/><path d="M10 50A40 40 0 0 1 90 50" stroke="${col}" stroke-dasharray="${c*Math.min(p,1)} ${c}"/></svg>`:
 `<svg viewBox="0 0 50 50" style="width:46px;height:46px;transform:rotate(-90deg);stroke-width:5"><circle cx="25" cy="25" r="20" stroke="#eee"/><circle cx="25" cy="25" r="20" stroke="${col}" stroke-dasharray="${125.6*Math.min(p,1)} 126"/></svg>`}
async function weekbar(){const w=await J('/api/week/'+S.date);return`<div class="wk">${w.map((x,i)=>`<button class="${x.date==S.date?'on':''}" onclick="S.date='${x.date}';render()"><span>${'PWŚCPSN'[i]}</span><span class="ring"><svg viewBox="0 0 42 42"><circle cx="21" cy="21" r="18" stroke="#eee"/><circle cx="21" cy="21" r="18" stroke="var(--g)" stroke-dasharray="${113*x.progress} 114"/></svg><b>${+x.date.slice(8)}</b></span></button>`).join('')}</div>`}
I.trash='<svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg>';I.cart='<svg viewBox="0 0 24 24"><path d="M5 8h14l-1 12H6zM9 8V6a3 3 0 0 1 6 0v2"/></svg>';
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const mealCard=(m,mode)=>{const done=m.stan=='zjedzony',tr=`<button class="trash" style="right:${mode=='plan'?30:-6}px" onclick="event.stopPropagation();delMeal(${m.id})" title="Usuń">${I.trash}</button>`;
return`<div class="${m.stan=='pominiety'?'skip':''}"><div class="card meal" onclick="openRec(${m.rid},${m.porcje},${m.id})"><div><h3>${m.tytul}</h3><p>B: ${m.b} g · T: ${m.t} g · W: ${m.w} g${m.porcje!=1?` · ×${m.porcje}`:''}</p><span class="pill">${m.kcal} kcal</span></div><img src="/img/${m.rid}" onerror="this.outerHTML='<div class=ph></div>'">
${mode=='plan'?(S.edit?`<button class="pen" onclick="event.stopPropagation();openPick(${m.id})">${I.pen}</button>${tr}`:''):`${tr}<div class="acts" onclick="event.stopPropagation()"><button onclick="openPick(${m.id})">${I.sw}Zamień</button><button onclick="setStan(${m.id},'${m.stan=='pominiety'?'plan':'pominiety'}')">${I.x}Pomiń</button><button class="${done?'done':''}" onclick="setStan(${m.id},'${done?'plan':'zjedzony'}')">${I.chk}Zjedzony</button></div>`}</div></div>`};
async function render(){
 $('#n1').className=S.view=='dz'?'on':'';$('#n2').className=S.view=='pl'?'on':'';
 try {
   const [wk,d]=await Promise.all([weekbar(),J('/api/day/'+S.date)]),dt=D(S.date),g=d.goal,e=d.eaten,today=S.date==iso(new Date());
   const title=today?'Dzisiaj':`${dt.getDate()} ${MIES[dt.getMonth()]} ${dt.getFullYear()}`;
   const dp=`onclick="$('#dp').value=S.date;$('#dp').showPicker?.()"`;
   if(S.view=='dz'){
     $('#app').innerHTML=`<div class="hd"><h1 ${dp} style="cursor:pointer">${title} ${I.car}</h1><div class="prof r">${I.x.replace(/<path.*\/>/,'<circle cx="12" cy="9" r="4"/><path d="M5 20c1-4 4-5 7-5s6 1 7 5"/>')}</div></div>${wk}
     <div class="car" onscroll="dots(this)"><div class="card sum c2"><div><b>Spożyte kcal</b>${arc(e.kcal/g.kcal,'var(--g)',1)}<div class="big" style="margin-top:-30px;cursor:pointer" onclick="editKcal(${e.kcal})">${e.kcal}<span style="font-size:13px;color:var(--mu)"> ✎</span></div><small style="cursor:pointer" onclick="editGoal(${g.kcal})">z ${g.kcal} ✎</small></div><div><b>Spalone kcal</b>${arc(0,'#e5372b',1)}<div class="big" style="margin-top:-30px">0</div><small>z 2100</small></div></div>
     <div class="card sum c3">${[['Białko',e.b,g.b,'#2f55d4'],['Tłuszcze',e.t,g.t,'#f0c419'],['Węglowodany',e.w,g.w,'#ef9a3c']].map(x=>`<div><b>${x[0]}</b><div style="margin:8px 0">${arc(x[1]/x[2],x[3])}</div><div class="big" style="font-size:20px">${x[1]} g</div><small>z${x[2]}</small></div>`).join('')}</div></div>
     <div class="dots"><i class="on"></i><i></i></div><div class="sec"><h2>Posiłki</h2>${sections(d.meals,'dz')}
     <button class="wide" onclick="openPick(null,0)"><span>Dodaj posiłek (dowolny)</span><span class="b">${I.plus}Dodaj</span></button></div>`;
   } else {
     $('#app').innerHTML=`<div class="hd"><h1>Twoja dieta</h1><button class="r" ${dp}>${I.cal}</button></div>${wk}
     <div class="dayrow"><b class="ser" style="font-size:18px">${DN[(dt.getDay()+6)%7]} ${S.date.slice(8)}.${S.date.slice(5,7)}</b><button onclick="$('#pdf').click()" title="Importuj PDF" style="font-size:22px;letter-spacing:2px">···</button></div>
     <div class="sec">${sections(d.meals,'plan')}<div class="card" style="margin:12px 0">Zjedz: <b>${d.planned.kcal} kcal</b> · B: <b>${d.planned.b} g</b> · T: <b>${d.planned.t} g</b> · W: <b>${d.planned.w} g</b></div>
     <div class="card" style="margin-bottom:12px;color:#2f55d4">💧 <span style="color:var(--tx)">Wypij co najmniej 2.2 l wody</span></div>
     <button class="wide" style="margin-top:0" onclick="openShop()"><span>Lista zakupów${d.shop?` (${d.shop})`:''}</span><span class="b">${I.cart}</span></button>
     <button class="wide" onclick="$('#pdf').click()"><span>Importuj przepisy z PDF</span><span class="b">${I.plus}PDF</span></button></div>
     <button class="fab" onclick="S.edit=!S.edit;render()">${S.edit?'Zakończ edycję':'Edytuj dietę'}</button>`;
   }
} catch (err) {
   console.error("Błąd ładowania danych:", err);
   const is502 = String(err).includes('502');
   $('#app').innerHTML = `
     <div style="text-align: center; padding: 40px 20px;">
       <h2>${is502 ? 'Błąd połączenia z serwerem (502)' : 'Brak danych w bazie'}</h2>
       <p style="color: #666; margin: 15px 0;">${is502 ? 'Serwer (Render) wygenerował błąd 502 Bad Gateway. Sprawdź zakładkę Logs na Renderze.' : 'Wgraj plik PDF, aby zasilić bazę danymi.'}</p>
       <button onclick="${is502 ? 'render()' : "$('#pdf').click()"}" style="background: #2f6b4f; color: white; border: none; padding: 14px 24px; border-radius: 20px; font-weight: bold; font-size: 16px; cursor: pointer;">
         ${is502 ? '🔄 Odśwież połączenie' : '📥 Wgraj plik PDF z dietą'}
       </button>
     </div>
   `;
 }
}
async function setStan(id,stan){await P('/api/meal/'+id,'PATCH',{stan});render()}
$('#dp').onchange=e=>{if(e.target.value){S.date=e.target.value;render()}};
// --- szczegóły przepisu ---
function closeRec(){$('#rec').classList.remove('show');render()}
async function delMeal(id){if(confirm('Usunąć ten posiłek z dnia?')){await J('/api/meal/'+id,{method:'DELETE'});render()}}
async function editKcal(cur){const v=prompt('Spożyte kcal tego dnia.\nPuste pole = suma z posiłków oznaczonych jako zjedzone.',cur);if(v===null)return;
 if(v.trim()!==''&&isNaN(+v.replace(',','.')))return toast('Wpisz liczbę');await P(`/api/day/${S.date}/kcal`,'PUT',{kcal:v.trim()===''?null:Math.round(+v.replace(',','.'))});render()}
async function editGoal(cur){const v=prompt('Dzienny cel kcal:',cur);if(!v||isNaN(+v))return;await P('/api/goal','PUT',{kcal:Math.round(+v)});render()}
async function setPor(id,n,mid){n=Math.max(.5,n);if(mid)await P('/api/meal/'+mid,'PATCH',{porcje:n});openRec(id,n,mid)}
async function addShop(items){const r=await P('/api/shop','POST',{items});toast(r.added?`Dodano do listy zakupów: ${r.added}`:'To już jest na liście zakupów')}
async function openRec(id,por=1,mid=null){const r=await J(`/api/recipe/${id}?porcje=${por}`);const s=$('#rec');s.classList.add('show');window.RI=r.skladniki;
 s.innerHTML=`<div class="hd"><button class="l" onclick="closeRec()">${I.back}</button><button class="r" style="display:flex;gap:6px;align-items:center;color:var(--g);font-weight:600" onclick="editRec(${id},${por},${mid})">${I.pen}Edytuj</button></div><img class="rimg" src="/img/${id}" onerror="this.style.display='none'">
 <div class="rt"><h1>${r.tytul}</h1></div><div class="mac"><div><b>${r.kcal}</b><small>Kalorie</small></div><div><b>${r.b} g</b><small>Białko</small></div><div><b>${r.w} g</b><small>Węgl.</small></div><div><b>${r.t} g</b><small>Tłuszcz</small></div></div>
 <div class="rs"><h2>Składniki</h2><div class="step">${mid?'Porcje w tym posiłku':'Ile porcji?'}<span style="flex:1"></span><button onclick="setPor(${id},${por-.5},${mid})">−</button><b>${por}</b><button onclick="setPor(${id},${por+.5},${mid})">+</button></div>
 <ul>${r.skladniki.map(x=>`<li><span>${x}</span><button title="Dodaj do listy zakupów" data-t="${esc(x)}" onclick="addShop([this.dataset.t])">${I.cart}</button></li>`).join('')}</ul>
 <button class="btn2" style="margin-top:12px" onclick="addShop(window.RI)">Dodaj wszystkie składniki do listy zakupów</button></div>
 <div class="rs"><h2>Jak to zrobić?</h2><ol>${r.kroki.map(x=>`<li>${x}</li>`).join('')}</ol></div>`;s.scrollTop=0}
async function editRec(id,por,mid){const r=await J(`/api/recipe/${id}?porcje=1`);$('#rec').innerHTML=`<div class="hd"><button class="l" onclick="openRec(${id},${por},${mid})">${I.back}</button><h1>Edytuj posiłek</h1></div><div class="ed">
 <label>Nazwa<input id="e_t" value="${esc(r.tytul)}"></label>
 <div class="g4"><label>kcal<input id="e_k" type="number" value="${r.kcal}"></label><label>Białko g<input id="e_b" type="number" step="0.1" value="${r.b}"></label><label>Węgl. g<input id="e_w" type="number" step="0.1" value="${r.w}"></label><label>Tłuszcz g<input id="e_f" type="number" step="0.1" value="${r.t}"></label></div>
 <div class="note" style="margin:0">Wartości na 1 porcję. Zmiany dotyczą tego przepisu w każdym dniu.</div>
 <label>Składniki (jeden w wierszu)<textarea id="e_s" rows="8">${esc(r.skladniki.join('\n'))}</textarea></label>
 <label>Jak to zrobić? (jeden krok w wierszu)<textarea id="e_p" rows="10">${esc(r.kroki.join('\n'))}</textarea></label>
 <button class="btn" onclick="saveRec(${id},${por},${mid})">Zapisz zmiany</button></div>`;$('#rec').scrollTop=0}
async function saveRec(id,por,mid){const L=x=>$(x).value.split('\n').map(z=>z.trim()).filter(Boolean),n=x=>+$(x).value.replace(',','.')||0;
 const r=await P('/api/recipe/'+id,'PUT',{tytul:$('#e_t').value,kcal:n('#e_k'),b:n('#e_b'),w:n('#e_w'),t:n('#e_f'),skladniki:L('#e_s'),kroki:L('#e_p')});
 if(r.error)return toast(r.error);toast('Zapisano');openRec(id,por,mid)}
// --- lista zakupów ---
async function openShop(){const y=$('#shop').scrollTop,l=await J('/api/shop'),s=$('#shop');s.classList.add('show');
 s.innerHTML=`<div class="hd"><button class="l" onclick="closeShop()">${I.back}</button><h1>Lista zakupów</h1></div>
 <div class="srch"><input id="si" placeholder="Dodaj produkt" onkeydown="if(event.key=='Enter')addOwn()"><button onclick="addOwn()">${I.plus}</button></div>
 <div style="padding:0 16px 8px"><button class="btn2" onclick="shopDay()">Dodaj składniki z dnia ${S.date.slice(8)}.${S.date.slice(5,7)}</button></div>
 ${l.map(x=>`<div class="si ${x.kupione?'bought':''}"><button class="ck" onclick="shopTick(${x.id},${x.kupione?0:1})">${x.kupione?I.chk:''}</button><span>${esc(x.tekst)}</span><button class="xx" onclick="shopDel(${x.id})">${I.x}</button></div>`).join('')||'<p class="sec" style="color:var(--mu)">Lista jest pusta.</p>'}
 ${l.some(x=>x.kupione)?'<div style="padding:12px 16px"><button class="btn2" onclick="shopClear()">Usuń kupione</button></div>':''}`;s.scrollTop=y}
function closeShop(){$('#shop').classList.remove('show');render()}
async function addOwn(){const v=$('#si').value.trim();if(v){await P('/api/shop','POST',{items:[v]});openShop()}}
async function shopDay(){const r=await P('/api/shop/day/'+S.date,'POST',{});toast(r.added?`Dodano pozycji: ${r.added}`:'Brak nowych składników');openShop()}
async function shopTick(id,k){await P('/api/shop/'+id,'PATCH',{kupione:k});openShop()}
async function shopDel(id){await J('/api/shop/'+id,{method:'DELETE'});openShop()}
async function shopClear(){await J('/api/shop?tylko_kupione=1',{method:'DELETE'});openShop()}
// --- wybór posiłku / zamiennik ---
const fav=()=>JSON.parse(localStorage.fav||'[]');let target,qt,PS=0;
function openPick(id,slot){target=id;S.max=5000;PS=slot??0;if(id){const m=S.ms.find(x=>x.id==id);PS=SL.findIndex(x=>x[0]==m?.slot)+1}
 $('#pick').classList.add('show');$('#pick').innerHTML=`<div class="hd"><button class="l" onclick="$('#pick').classList.remove('show')">${I.back}</button><h1>${id?'Wybierz zamiennik':'Dodaj posiłek'}</h1></div>
 <div class="srch"><input id="q" placeholder="Szukaj" oninput="clearTimeout(qt);qt=setTimeout(list,200)"><button onclick="S.max=S.max==5000?500:5000;toast(S.max==5000?'Bez limitu kcal':'Tylko do 500 kcal');list()">${I.flt}</button></div>
 <div class="chips" id="ch"></div><div id="nt"></div><div id="ol"></div>`;list()}
async function list(){const r=await J(`/api/recipes?q=${encodeURIComponent($('#q').value)}&max=${S.max}&slot=${PS}`),f=fav();
 $('#ch').innerHTML=[[0,'Wszystkie'],...SL.map((x,i)=>[i+1,`Posiłek ${i+1}`])].map(x=>`<button class="${PS==x[0]?'on':''}" onclick="PS=${x[0]};list()">${x[1]}</button>`).join('');
 $('#nt').innerHTML=PS&&!r.assigned?'<div class="note">Przepisy nie mają jeszcze przypisanego numeru posiłku – wgraj ponownie PDF (Plan → Importuj), a rozdzielą się na Posiłek 1–5.</div>':'';
 $('#ol').innerHTML=r.items.map(x=>`<div class="opt" onclick="choose(${x.id})"><div><h3>${x.tytul}</h3><p>${x.kcal} kcal · B: ${x.b} g · W: ${x.w} g · T: ${x.t} g</p></div><img src="/img/${x.id}" onerror="this.style.visibility='hidden'">
 <button class="h" onclick="event.stopPropagation();tf(${x.id})">${f.includes(x.id)?I.heart:I.heart.replace('fill:#d33','fill:none')}</button></div>`).join('')||'<p class="sec">Brak wyników.</p>'}
function tf(i){let f=fav();f=f.includes(i)?f.filter(x=>x!=i):[...f,i];localStorage.fav=JSON.stringify(f);list()}
async function choose(rid){if(target)await P('/api/meal/'+target,'PATCH',{rid});else await P(`/api/day/${S.date}/meal`,'POST',{rid,slot:PS?SL[PS-1][0]:'Dodatkowy'});$('#pick').classList.remove('show');render()}
// --- import PDF ---
$('#pdf').onchange=async e=>{
  if(!e.target.files[0]) return;
  const f=new FormData();f.append('pdf',e.target.files[0]);toast('Przetwarzam PDF…');
  try {
    const r=await J('/api/import-pdf',{method:'POST',body:f});
    toast(r.error||`Nowych: ${r.added}, zaktualizowanych: ${r.updated}`);
    render();
  } catch(err) {
    console.error(err);
    toast('Błąd serwera (502) podczas wgrywania PDF');
  } finally {
    e.target.value='';
  }
};
render();
</script></body></html>
